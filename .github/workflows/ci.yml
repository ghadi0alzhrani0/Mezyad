name: Stage 3 validation
on:
  pull_request:
  push:
    branches: [main, chore/repository-alignment]
permissions:
  contents: read
concurrency:
  group: mezyad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mezyad_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: mezyad_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mezyad_test -d mezyad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mezyad_test:ci_test_only@127.0.0.1:5432/mezyad_test
      TEST_DATABASE_URL: postgresql://mezyad_test:ci_test_only@127.0.0.1:5432/mezyad_test
      E2E_DATABASE_URL: postgresql://mezyad_test:ci_test_only@127.0.0.1:5432/mezyad_e2e_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:stage3
      - run: npm run verify:repository
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Create isolated end-to-end database
        run: node --input-type=module -e "import {createPool} from './backend/src/db.js'; const p=createPool(process.env.DATABASE_URL); await p.query('CREATE DATABASE mezyad_e2e_test'); await p.end();"
      - name: API, PostgreSQL integration, banking mock and React tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Public/private journeys and resubmission in a real browser
        run: npm run test:e2e
      - run: npm run verify:stage3
