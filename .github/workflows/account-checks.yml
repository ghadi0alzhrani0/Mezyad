name: Account integration checks

on:
  pull_request:
  push:
    branches: [main, 'feature/account-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: account-ci-only
          POSTGRES_DB: mezyad_accounts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mezyad_accounts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:account-ci-only@localhost:5432/mezyad_accounts_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Check backend syntax
        run: npm run check
        working-directory: backend
      - name: Run HTTP and PostgreSQL account tests
        run: npm test
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Run account UI tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
